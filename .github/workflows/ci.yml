# What this project is: A Node.js project that serves as a backend RESTful API designed to manage and expose data for specific application resources. It provides endpoints for CRUD (Create, Read, Update, Delete) operations and implements core business logic.
# Tech Stack: Node.js, TypeScript, Express.js, TypeORM, Jest.
#
# Implemented in this sprint: NJA-2, NJA-3, NJA-4, NJA-6, NJA-7, NJA-9, NJA-10, NJA-12, NJA-13, NJA-14, NJA-15
name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build
        run: npm run build --if-present

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Skip — deploy secrets not configured
        if: env.EC2_HOST == ''
        run: echo "No EC2_HOST secret found. Skipping deploy."

      - name: Checkout code
        if: env.EC2_HOST != ''
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            if [ -f .env.sample ]; then
              touch .env
              while IFS= read -r line; do
                [[ -z "$line" || "$line" == \#* ]] && continue
                key=$(echo "$line" | cut -d= -f1)
                if ! grep -q "^${key}=" .env 2>/dev/null; then
                  echo "$line" >> .env
                  echo "New env var added (set real value): ${key}"
                fi
              done < .env.sample
            fi
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build --if-present
            pm2 reload app --update-env || pm2 start dist/index.js --name app
            pm2 save
